name: weekly-catalog

on:
  schedule:
    # 每周一 10:00 北京时间（UTC 02:00）
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Weekly news + conservative roster
        run: npm run update:weekly
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: weekly news and conservative roster swaps"
          file_pattern: data/*.json js/data.js roster.html assets/logos/*.ico
